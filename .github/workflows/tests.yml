# Installs TRACE from scratch and tests it on Windows, macOS (Apple Silicon
# and Intel) and Linux, on Python 3.10, 3.12 and 3.14.
#
# Public-repository hygiene, deliberately:
#   * the token is read-only (permissions: contents: read);
#   * no secrets are used anywhere -- VirusTotal is tested against a faked
#     network, never a real key;
#   * forks run through `pull_request`, never `pull_request_target`, so code
#     from a fork cannot reach anything privileged;
#   * third-party actions are pinned to full commit SHAs (tags can be moved);
#   * only public test images are used, downloaded from their publishers and
#     checked against recorded SHA-256s -- no evidence is ever stored here.
#
# What runs depends on what changed (tools/testdata/ci_select.py, shown on
# each run's summary page): a push or pull request runs the test files that
# reach the code it touched, restores only the data groups those read, and
# scores the carver only if carving changed. The weekly run and a manual run
# test everything. CI only ever uses the small CI data set
# (tools/testdata/catalog.py), cached by GitHub; the full data set runs on
# maintainers' machines (tools/run_tests.py full).
#
# Where it runs depends on how close the change is to master
# (ci_select.matrix): a branch push is one quick job (Ubuntu, Python 3.12);
# master and pull requests run on every operating system with Python 3.10
# and 3.14; the weekly and manual runs add 3.12.

name: Tests

on:
  push:
    branches: ['**']     # not tags: a release tag is master's code, tested
  pull_request:
  workflow_dispatch:
  # Weekly, everything: catches what the per-change selection lets through,
  # and a dependency release that breaks an untouched part.
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  no-evidence-in-repo:
    name: No evidence in the repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Refuse disk images and case databases
        run: |
          found=$(git ls-files | grep -iE '\.(e0[0-9]|ex01|l01|s01|ad1|dd|raw|img|dmg|iso|vmdk|vhdx?|aff4?|001)$|(^|/)(case|search)\.db(-wal|-shm)?$' || true)
          if [ -n "$found" ]; then
            echo "These must never be committed:"; echo "$found"; exit 1
          fi
          echo "No evidence files tracked."

  plan:
    name: Choose tests from the change
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.select.outputs.run }}
      full: ${{ steps.select.outputs.full }}
      tests: ${{ steps.select.outputs.tests }}
      fetch_images: ${{ steps.select.outputs.fetch_images }}
      artifacts: ${{ steps.select.outputs.artifacts }}
      corpus: ${{ steps.select.outputs.corpus }}
      linux_images: ${{ steps.select.outputs.linux_images }}
      carve_score: ${{ steps.select.outputs.carve_score }}
      pythons: ${{ steps.select.outputs.pythons }}
      oses: ${{ steps.select.outputs.oses }}
      include: ${{ steps.select.outputs.include }}
    steps:
      # Whole history: a branch is compared with where it left the default
      # branch, so a push cancelled by a newer one loses nothing.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select
        id: select
        run: python3 tools/testdata/ci_select.py --github

  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu pinned to 24.04: "ubuntu-latest" moves to Ubuntu 26 on
        # 19 October 2026, and the installer's apt package names are
        # 24.04's. Move it on purpose, after trying 26.04.
        # tools/testdata/ci_select.ALL_OSES: windows-latest, macos-latest, macos-15-intel,
        # ubuntu-24.04.
        os: ${{ fromJSON(needs.plan.outputs.oses) }}
        python: ${{ fromJSON(needs.plan.outputs.pythons) }}
        # Python 3.11 on Linux beside the grid (ci_select.EXTRA_JOBS).
        include: ${{ fromJSON(needs.plan.outputs.include) }}

    env:
      QT_QPA_PLATFORM: offscreen
      TRACE_REQUIRE_IMAGES: '1'
      PYTHONUTF8: '1'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        id: python
        with:
          python-version: ${{ matrix.python }}

      # No Homebrew libmagic removal: a Mac needs none, and
      # test_core's bundled-libmagic test fails if any other copy loads.

      # The real installers, unattended: they are part of what is tested.
      - name: Install (macOS / Linux)
        if: runner.os != 'Windows'
        env:
          TRACE_PYTHON: ${{ steps.python.outputs.python-path }}
        run: ./install.sh --yes

      - name: Install (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./install_windows.ps1 -Yes

      - name: Nothing was compiled
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then PY=venv/Scripts/python; else PY=venv/bin/python; fi
          "$PY" - <<'EOF'
          import trace_app   # before magic: on macOS it selects the bundled libmagic
          import sys, pytsk3, pyewf, PySide6, magic, py7zr, pymupdf, PIL
          from trace_app.infra.preflight import libmagic_identity
          print("Python", sys.version.split()[0])
          print("Sleuth Kit", pytsk3.TSK_VERSION_STR, "| libewf", pyewf.get_version())
          print("PySide6", PySide6.__version__, "| Pillow", PIL.__version__)
          print("libmagic %s from %s" % libmagic_identity())
          EOF

      # Test data is cached by GitHub, one cache per group, keyed only by
      # that group's catalog: downloaded from the publishers once, then
      # restored inside GitHub's network on every run. Image files are the
      # same on every system, so all four share one copy
      # (enableCrossOsArchive). Only the CI set is ever used here: the
      # local, NIST and private data run on maintainers' machines
      # (tools/run_tests.py full). The fetch verifies every SHA-256.
      - name: Restore ci data
        id: cache-ci
        if: needs.plan.outputs.fetch_images == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: test_images/ci
          key: test-data-ci-${{ hashFiles('tools/testdata/catalog.py') }}
          enableCrossOsArchive: true

      - name: Get ci data
        if: needs.plan.outputs.fetch_images == 'true'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then PY=venv/Scripts/python; else PY=venv/bin/python; fi
          "$PY" -m tools.testdata.fetch --group ci

      # Only master, the weekly and manual runs save: branches restore what
      # master saved and never fill the repository's 10 GB with copies.
      - name: Save ci data
        if: needs.plan.outputs.fetch_images == 'true' && steps.cache-ci.outputs.cache-hit != 'true' && (github.ref == 'refs/heads/master' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: test_images/ci
          key: test-data-ci-${{ hashFiles('tools/testdata/catalog.py') }}
          enableCrossOsArchive: true
      # Real published files of every format the DFTT/DFRWS images do not
      # hold, pinned by SHA-256, laid out into carve-corpus.dd
      # (tools/testdata/build/carve_corpus.py).
      - name: Restore corpus data
        id: cache-corpus
        if: needs.plan.outputs.corpus == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: test_images/corpus
          key: test-data-corpus-${{ hashFiles('tools/testdata/build/carve_corpus.py') }}
          enableCrossOsArchive: true

      - name: Get corpus data
        if: needs.plan.outputs.corpus == 'true'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then PY=venv/Scripts/python; else PY=venv/bin/python; fi
          "$PY" tools/testdata/build/carve_corpus.py

      # Only master, the weekly and manual runs save: branches restore what
      # master saved and never fill the repository's 10 GB with copies.
      - name: Save corpus data
        if: needs.plan.outputs.corpus == 'true' && steps.cache-corpus.outputs.cache-hit != 'true' && (github.ref == 'refs/heads/master' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: test_images/corpus
          key: test-data-corpus-${{ hashFiles('tools/testdata/build/carve_corpus.py') }}
          enableCrossOsArchive: true

      # Images made by the Linux kernel and its own tools, on loop devices
      # (so root, and Linux only; the tests reading them skip elsewhere),
      # into test_images/built (tools/testdata/build/): a Btrfs volume with
      # known deleted files, md RAID arrays of every level and superblock,
      # and GPT -> LUKS1/LUKS2 -> LVM -> ext4 disks.
      - name: Build the Linux images
        if: runner.os == 'Linux' && needs.plan.outputs.linux_images == 'true'
        run: |
          sudo apt-get install -y -qq --no-install-recommends btrfs-progs \
            mdadm cryptsetup-bin lvm2 >/dev/null
          sudo python3 tools/testdata/build/make_btrfs_deleted.py
          sudo python3 tools/testdata/build/make_md_raid.py
          sudo python3 tools/testdata/build/make_luks_lvm.py
          sudo chown -R "$USER" test_images/built

      # Real artifacts -- hives, logs, databases, small images -- pinned by
      # SHA-256 (tools/testdata/samples.py).
      - name: Restore samples data
        id: cache-samples
        if: needs.plan.outputs.artifacts == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: test_images/samples
          key: test-data-samples-${{ hashFiles('tools/testdata/samples.py') }}
          enableCrossOsArchive: true

      - name: Get samples data
        if: needs.plan.outputs.artifacts == 'true'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then PY=venv/Scripts/python; else PY=venv/bin/python; fi
          "$PY" -m tools.testdata.fetch --group samples

      # Only master, the weekly and manual runs save: branches restore what
      # master saved and never fill the repository's 10 GB with copies.
      - name: Save samples data
        if: needs.plan.outputs.artifacts == 'true' && steps.cache-samples.outputs.cache-hit != 'true' && (github.ref == 'refs/heads/master' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: test_images/samples
          key: test-data-samples-${{ hashFiles('tools/testdata/samples.py') }}
          enableCrossOsArchive: true

      # -rfE: every failure and error summarised at the end of the log;
      # the JUnit report feeds the run's summary page and the artifact.
      # TESTS empty = every test file (a full run).
      - name: Tests
        if: needs.plan.outputs.full == 'true' || needs.plan.outputs.tests != ''
        shell: bash
        env:
          TESTS: ${{ needs.plan.outputs.tests }}
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then PY=venv/Scripts/python; else PY=venv/bin/python; fi
          # One worker per core; a test file stays on one worker, so the UI
          # tests' shared window and module fixtures behave as in series.
          # Each worker has its own sandbox (conftest), so none collide.
          "$PY" -m pytest -n auto --dist loadfile -v -rfE --junitxml=test-results.xml $TESTS

      - name: Carving against published answer keys
        if: needs.plan.outputs.carve_score == 'true'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then PY=venv/Scripts/python; else PY=venv/bin/python; fi
          "$PY" tools/score/carve_score.py 11-carve-fat.dd 12-carve-ext2.dd carve-corpus.dd

      # Which tests failed, on the run's summary page -- not 600 lines
      # down a log.
      - name: Summarise failures
        if: failure()
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then PY=venv/Scripts/python; else PY=venv/bin/python; fi
          [ -f test-results.xml ] || { echo "No test report: the tests did not run." >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          "$PY" - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import os, xml.etree.ElementTree as ET
          root = ET.parse('test-results.xml').getroot()
          suites = [root] if root.tag == 'testsuite' else list(root)
          title = f"{os.environ.get('RUNNER_OS')} / Python {os.environ.get('PYTHON_VERSION', '')}"
          print(f"### Failed tests: {title}\n")
          for suite in suites:
              for case in suite.iter('testcase'):
                  for problem in list(case.findall('failure')) + list(case.findall('error')):
                      name = f"{case.get('classname')}::{case.get('name')}"
                      text = (problem.get('message') or '').splitlines()[:1]
                      print(f"- `{name}` -- {text[0][:300] if text else problem.tag}")
          EOF
        env:
          PYTHON_VERSION: ${{ matrix.python }}

      - name: Keep the test report and installer log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: test-report-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            test-results.xml
            install.log
          if-no-files-found: ignore
          retention-days: 14
