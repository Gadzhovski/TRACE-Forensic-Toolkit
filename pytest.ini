[pytest]
testpaths = tests
addopts = -ra
# A test still running after ten minutes has hung: every thread's stack is
# printed, so the log says where -- a hung CI job otherwise shows nothing
# but its own cancellation.
faulthandler_timeout = 600
# The UI tests run the real window without a display.
markers =
    ui: drives the real MainWindow offscreen
    images: needs public test images (python tools/fetch_test_images.py)
filterwarnings =
    ignore::DeprecationWarning:PySide6.*
